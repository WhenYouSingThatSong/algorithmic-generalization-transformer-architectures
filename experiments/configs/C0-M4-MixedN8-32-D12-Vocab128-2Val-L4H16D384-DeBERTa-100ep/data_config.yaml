# Explicit tokenizer size: 128 variable names + N/A = 129 (official full-pool renaming).
tokenizer_n_vars: 128
dag_config:
  data_file_name: train_data.pt
  fix_graph: false
  func_vocab:
  - ADD
  max_comp_depth: 12
  max_depth: 12
  max_fan_in_deg: 3
  max_length: 256
  min_fan_in_deg: 1
  mod_val: 23
  num_leaf_nodes: 6
  num_nodes: 32
  num_samples: 100000
  shuffle_node_name: true
  verbose: false
data_dir: data/C0-MixedN8-32-D12-Vocab128-ADD
tokenizer_file_name: tokenizer.pickle
val_dag_config:
  data_file_name: val_data.pt
  fix_graph: false
  func_vocab:
  - ADD
  max_comp_depth: 12
  max_depth: 12
  max_fan_in_deg: 3
  max_length: 256
  min_fan_in_deg: 1
  mod_val: 23
  num_leaf_nodes: 6
  num_nodes: 32
  num_samples: 2000
  shuffle_node_name: true
  verbose: false

# Second validation stream: the old N128/depth7-18 protocol.
# It is NOT used for the main checkpoint; a separate -n128 checkpoint is saved.
val2_data_dir: data/Tr32Test128-ADD
val2_data_file_name: val_data.pt
val2_dag_config:
  data_file_name: val_data.pt
  fix_graph: false
  func_vocab:
  - ADD
  max_comp_depth: 36
  max_depth: 36
  max_fan_in_deg: 3
  max_length: 1024
  min_fan_in_deg: 1
  mod_val: 23
  num_leaf_nodes: 6
  num_nodes: 128
  num_samples: 1000
  shuffle_node_name: true
  verbose: false
